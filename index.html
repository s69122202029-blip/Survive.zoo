<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survive | Zoo Ticket Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Kanit",sans-serif;
    background:#f5f7f2;
    color:#17251c;
    line-height:1.6;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

:root{
    --green:#14532d;
    --green2:#1f7a45;
    --green3:#2e9d59;
    --light-green:#e9f5e9;
    --cream:#fffaf0;
    --orange:#f59e0b;
    --orange2:#d97706;
    --dark:#142019;
    --gray:#647067;
    --light:#f5f7f2;
    --white:#ffffff;
    --border:#e0e7df;
    --shadow:0 15px 40px rgba(20,83,45,.10);
}

/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    height:76px;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(20,83,45,.08);
}

.nav-inner{
    width:min(1180px,92%);
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    color:var(--green);
    font-family:"Montserrat",sans-serif;
    cursor:pointer;
}

.logo-icon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    box-shadow:0 8px 20px rgba(20,83,45,.22);
}

.logo-icon svg{
    width:30px;
    height:30px;
}

.logo-text{
    font-size:22px;
    letter-spacing:.5px;
}

.logo-text span{
    color:var(--orange);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:7px;
}

.nav-btn{
    border:0;
    background:transparent;
    padding:10px 15px;
    border-radius:12px;
    color:#536057;
    font-size:15px;
    transition:.25s;
}

.nav-btn:hover,
.nav-btn.active{
    background:var(--light-green);
    color:var(--green);
}

.nav-ticket{
    background:var(--orange);
    color:#fff!important;
    font-weight:600;
    box-shadow:0 7px 18px rgba(245,158,11,.25);
}

.nav-ticket:hover{
    background:var(--orange2)!important;
    color:#fff!important;
}

.menu-toggle{
    display:none;
    border:0;
    background:var(--light-green);
    color:var(--green);
    width:44px;
    height:44px;
    border-radius:12px;
    font-size:22px;
}

/* =====================================================
   PAGE
===================================================== */

.page{
    display:none;
    min-height:100vh;
    padding-top:76px;
}

.page.active{
    display:block;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:650px;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(
        90deg,
        rgba(8,36,19,.90),
        rgba(8,36,19,.62),
        rgba(8,36,19,.20)
    ),
    url("https://cdn-imgix.headout.com/media/images/d8d00965d3690608ea21a78b31800325-11654---San-Diego---San-Diego-Zoo-Tickets-with-Guided-Bus-Tour---Skyfari-Aerial-Tram---16.jpg?ar=16%3A9&auto=format&crop=faces&fit=crop&h=687.6&q=90&w=1222.3999999999999")
    center/cover;
}

.hero-content{
    width:min(1180px,92%);
    margin:auto;
    color:#fff;
    padding:70px 0;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.25);
    padding:8px 15px;
    border-radius:30px;
    font-size:14px;
    margin-bottom:20px;
    backdrop-filter:blur(8px);
}

.hero h1{
    font-family:"Montserrat",sans-serif;
    font-size:clamp(42px,7vw,76px);
    line-height:1.05;
    margin-bottom:18px;
    max-width:700px;
}

.hero h1 span{
    color:#fbbf24;
}

.hero p{
    max-width:610px;
    color:#eef8f0;
    font-size:18px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    padding:13px 22px;
    border-radius:13px;
    font-size:15px;
    font-weight:600;
    transition:.25s;
}

.btn-primary{
    background:var(--orange);
    color:#fff;
}

.btn-primary:hover{
    background:var(--orange2);
    transform:translateY(-2px);
}

.btn-green{
    background:var(--green);
    color:#fff;
}

.btn-green:hover{
    background:var(--green2);
    transform:translateY(-2px);
}

.btn-light{
    background:#fff;
    color:var(--green);
}

.btn-light:hover{
    transform:translateY(-2px);
}

/* =====================================================
   SECTION
===================================================== */

.section{
    padding:75px 0;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:30px;
}

.eyebrow{
    color:var(--orange2);
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.section-title{
    font-family:"Montserrat",sans-serif;
    font-size:32px;
    color:var(--green);
    margin-top:5px;
}

.section-desc{
    color:var(--gray);
    max-width:600px;
}

/* =====================================================
   QUICK CARDS
===================================================== */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.quick-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
    box-shadow:var(--shadow);
    transition:.25s;
    cursor:pointer;
}

.quick-card:hover{
    transform:translateY(-5px);
}

.quick-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--light-green);
    color:var(--green);
    font-size:25px;
    margin-bottom:18px;
}

.quick-card h3{
    color:var(--green);
    margin-bottom:5px;
}

.quick-card p{
    color:var(--gray);
    font-size:14px;
}

/* =====================================================
   TICKET CARDS
===================================================== */

.ticket-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.ticket-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:.25s;
}

.ticket-card:hover{
    transform:translateY(-5px);
}

.ticket-img{
    height:220px;
    background-size:cover;
    background-position:center;
}

.ticket-body{
    padding:22px;
}

.ticket-body h3{
    color:var(--green);
    font-size:21px;
}

.ticket-body p{
    color:var(--gray);
    font-size:14px;
    margin:7px 0 15px;
}

.price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.price{
    font-size:25px;
    font-weight:700;
    color:var(--orange2);
}

.price small{
    font-size:12px;
    color:var(--gray);
    font-weight:400;
}

/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{
    background:
    linear-gradient(
        135deg,
        #e9f5e9,
        #fffaf0
    );
    padding:60px 0 45px;
    border-bottom:1px solid var(--border);
}

.page-header h1{
    color:var(--green);
    font-family:"Montserrat",sans-serif;
    font-size:42px;
}

.page-header p{
    color:var(--gray);
    margin-top:8px;
}

/* =====================================================
   MAP
===================================================== */

.map-layout{
    display:grid;
    grid-template-columns:1.6fr .8fr;
    gap:25px;
}

.map-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:25px;
    padding:20px;
    box-shadow:var(--shadow);
}

.map-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.map-top h2{
    color:var(--green);
}

.map{
    position:relative;
    height:520px;
    border-radius:20px;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            #dcefd7,
            #eef7e9 50%,
            #d5e8d0
        );
}

.map:before{
    content:"";
    position:absolute;
    inset:20px;
    border:2px dashed rgba(20,83,45,.20);
    border-radius:25px;
}

.map-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
}

.map-edge{
    stroke:#ffffff;
    stroke-width:7;
    stroke-linecap:round;
    opacity:.95;
}

.map-edge.active{
    stroke:var(--orange);
    stroke-width:10;
}

.map-node{
    position:absolute;
    transform:translate(-50%,-50%);
    z-index:5;
    width:76px;
    height:76px;
    border-radius:50%;
    background:#fff;
    border:5px solid var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    font-weight:700;
    color:var(--green);
    box-shadow:0 7px 20px rgba(0,0,0,.18);
    transition:.2s;
}

.map-node:hover,
.map-node.selected{
    background:var(--orange);
    border-color:#fff;
    color:#fff;
    transform:translate(-50%,-50%) scale(1.08);
}

.node-entrance{
    left:12%;
    top:52%;
}

.node-lion{
    left:31%;
    top:25%;
}

.node-elephant{
    left:50%;
    top:50%;
}

.node-panda{
    left:72%;
    top:24%;
}

.node-aqua{
    left:82%;
    top:60%;
}

.node-bird{
    left:54%;
    top:78%;
}

.node-exit{
    left:20%;
    top:82%;
}

.node-food{
    left:40%;
    top:12%;
}

.map-panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:25px;
    padding:24px;
    box-shadow:var(--shadow);
}

.map-panel h3{
    color:var(--green);
    margin-bottom:15px;
}

.route-select{
    display:grid;
    gap:12px;
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#526057;
    font-size:13px;
    margin-bottom:5px;
}

.field select,
.field input{
    width:100%;
    padding:11px 13px;
    border:1px solid #dce4dc;
    border-radius:11px;
    background:#fff;
    outline:none;
}

.route-result{
    background:var(--light-green);
    border-radius:15px;
    padding:16px;
    margin-top:15px;
    display:none;
}

.route-result.show{
    display:block;
}

.route-result strong{
    color:var(--green);
}

.route-line{
    color:var(--orange2);
    font-weight:600;
    margin:7px 0;
}

.info-list{
    list-style:none;
}

.info-list li{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed #dce4dc;
    font-size:14px;
}

.info-list li:last-child{
    border-bottom:0;
}

/* =====================================================
   ACTIVITIES
===================================================== */

.activity-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:25px;
}

.category-box{
    background:#fff;
    border:1px solid var(--border);
    border-radius:22px;
    padding:20px;
    box-shadow:var(--shadow);
    height:max-content;
}

.category-box h3{
    color:var(--green);
    margin-bottom:12px;
}

.category-btn{
    display:block;
    width:100%;
    border:0;
    background:transparent;
    padding:12px;
    text-align:left;
    border-radius:11px;
    color:#536057;
    margin-bottom:5px;
}

.category-btn:hover,
.category-btn.active{
    background:var(--light-green);
    color:var(--green);
    font-weight:600;
}

.activity-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.activity-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.activity-img{
    height:220px;
    background-size:cover;
    background-position:center;
}

.activity-body{
    padding:20px;
}

.activity-body h3{
    color:var(--green);
}

.activity-body p{
    color:var(--gray);
    font-size:14px;
    margin:5px 0 15px;
}

.activity-meta{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.tag{
    background:var(--light-green);
    color:var(--green);
    padding:5px 9px;
    border-radius:8px;
    font-size:12px;
}

/* =====================================================
   BOOKING
===================================================== */

.booking-layout{
    display:grid;
    grid-template-columns:1fr .75fr;
    gap:25px;
    align-items:start;
}

.booking-card,
.summary-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:24px;
    padding:26px;
    box-shadow:var(--shadow);
}

.booking-card h2,
.summary-card h2{
    color:var(--green);
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-full{
    grid-column:1/-1;
}

.ticket-type{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.ticket-option input{
    display:none;
}

.ticket-option label{
    display:block;
    border:1px solid #dce4dc;
    border-radius:13px;
    padding:14px;
    cursor:pointer;
    text-align:center;
}

.ticket-option input:checked + label{
    border-color:var(--green);
    background:var(--light-green);
    color:var(--green);
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.qty-btn{
    width:35px;
    height:35px;
    border:0;
    border-radius:9px;
    background:var(--light-green);
    color:var(--green);
    font-size:18px;
}

.qty-number{
    min-width:30px;
    text-align:center;
    font-weight:700;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px dashed #dce4dc;
}

.summary-row:last-child{
    border-bottom:0;
}

.total{
    color:var(--orange2);
    font-size:25px;
    font-weight:700;
}

.payment-box{
    background:var(--light-green);
    padding:15px;
    border-radius:15px;
    margin:18px 0;
    font-size:14px;
    color:#41614c;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(7,22,12,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.ticket-result{
    width:min(480px,100%);
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 25px 80px rgba(0,0,0,.3);
}

.ticket-head{
    background:var(--green);
    color:#fff;
    padding:25px;
    text-align:center;
}

.ticket-head h2{
    font-family:"Montserrat",sans-serif;
}

.ticket-body-result{
    padding:25px;
}

.ticket-zoo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--green);
    font-weight:700;
    margin-bottom:20px;
}

.booking-id{
    text-align:center;
    background:var(--light-green);
    padding:14px;
    border-radius:12px;
    margin-bottom:20px;
}

.booking-id small{
    color:var(--gray);
}

.booking-id strong{
    display:block;
    color:var(--green);
    font-size:22px;
    letter-spacing:2px;
}

.ticket-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.ticket-info div{
    background:#f8faf7;
    border-radius:11px;
    padding:11px;
}

.ticket-info small{
    display:block;
    color:var(--gray);
    font-size:11px;
}

.ticket-info strong{
    color:#25372a;
}

.ticket-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.ticket-actions button{
    flex:1;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    background:#102318;
    color:#dbe7dd;
    padding:45px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr;
    gap:35px;
}

.footer-logo{
    color:#fff;
    font-size:25px;
    font-weight:700;
    margin-bottom:10px;
}

footer p{
    color:#a9b9ad;
    font-size:14px;
}

footer h4{
    color:#fff;
    margin-bottom:12px;
}

.footer-links{
    list-style:none;
}

.footer-links li{
    margin:7px 0;
    color:#a9b9ad;
    cursor:pointer;
}

.footer-links li:hover{
    color:#fff;
}

.copyright{
    border-top:1px solid rgba(255,255,255,.1);
    margin-top:30px;
    padding-top:20px;
    text-align:center;
    color:#829287;
    font-size:13px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#102318;
    color:#fff;
    padding:14px 18px;
    border-radius:12px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    z-index:5000;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .ticket-grid{
        grid-template-columns:1fr 1fr;
    }

    .map-layout,
    .booking-layout{
        grid-template-columns:1fr;
    }

    .activity-layout{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:700px){

    .navbar{
        height:68px;
    }

    .page{
        padding-top:68px;
    }

    .nav-links{
        position:absolute;
        top:68px;
        left:0;
        right:0;
        background:#fff;
        padding:12px;
        display:none;
        flex-direction:column;
        border-bottom:1px solid var(--border);
        box-shadow:0 15px 30px rgba(0,0,0,.08);
    }

    .nav-links.show{
        display:flex;
    }

    .nav-btn{
        width:100%;
        text-align:left;
    }

    .menu-toggle{
        display:block;
    }

    .hero{
        min-height:620px;
    }

    .hero h1{
        font-size:46px;
    }

    .hero p{
        font-size:16px;
    }

    .ticket-grid,
    .activity-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-full{
        grid-column:auto;
    }

    .ticket-type{
        grid-template-columns:1fr;
    }

    .map{
        height:430px;
    }

    .map-node{
        width:60px;
        height:60px;
        font-size:9px;
    }

    .section{
        padding:55px 0;
    }

    .page-header h1{
        font-size:34px;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:450px){

    .quick-grid{
        grid-template-columns:1fr;
    }

    .hero-buttons{
        flex-direction:column;
        align-items:stretch;
    }

    .hero-buttons .btn{
        width:100%;
    }

    .map{
        height:390px;
    }

    .map-node{
        width:53px;
        height:53px;
        font-size:8px;
        border-width:3px;
    }

    .node-entrance{
        left:10%;
    }

    .node-lion{
        left:29%;
    }

    .node-elephant{
        left:50%;
    }

    .node-panda{
        left:73%;
    }
